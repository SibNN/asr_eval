<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- A vibrant modern gradient spanning from hot pink/purple to cool teal/blue -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00782a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00aba5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#125ce6;stop-opacity:1" />
    </linearGradient>
    
    <!-- A subtle drop shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Group centered in the document -->
  <g transform="translate(250, 250)" filter="url(#shadow)">
    
    <!-- Petal 1 (Top) -->
    <!-- The path uses Bezier curves to create a fluid, organic 'droplet' shape -->
    <path d="M 0 0 C 60 -60, 100 -120, 0 -210 C -100 -120, -60 -60, 0 0 Z" 
          fill="url(#logoGradient)" 
          opacity="0.85" />
          
    <!-- Petal 2 (Rotated 120 degrees) -->
    <path d="M 0 0 C 60 -60, 100 -120, 0 -210 C -100 -120, -60 -60, 0 0 Z" 
          fill="url(#logoGradient)" 
          opacity="0.85" 
          transform="rotate(120)" />
          
    <!-- Petal 3 (Rotated 240 degrees) -->
    <path d="M 0 0 C 60 -60, 100 -120, 0 -210 C -100 -120, -60 -60, 0 0 Z" 
          fill="url(#logoGradient)" 
          opacity="0.85" 
          transform="rotate(240)" />
          
    <!-- A small clean center circle to tie the geometry together -->
    <circle cx="0" cy="0" r="15" fill="#FFFFFF" />
  </g>
</svg>
